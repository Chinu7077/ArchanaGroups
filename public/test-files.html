<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Test Page</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .file-input { margin: 20px 0; }
        .results { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .error { background-color: #ffebee; border-color: #f44336; }
        .success { background-color: #e8f5e8; border-color: #4caf50; }
        pre { background-color: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Excel File Test Tool</h1>
        <p>Use this tool to test your Excel files before uploading to the main system.</p>
        
        <div class="file-input">
            <label for="fileInput">Select Excel File:</label><br>
            <input type="file" id="fileInput" accept=".xlsx,.xls" />
        </div>
        
        <div id="results" class="results" style="display: none;"></div>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = '<h3>Testing file...</h3>';
            
            console.log('File selected:', {
                name: file.name,
                size: file.size,
                type: file.type,
                lastModified: file.lastModified
            });
            
            // Test file format
            const isValidFormat = file.name.match(/\.(xlsx|xls)$/i);
            const isValidSize = file.size <= 10 * 1024 * 1024;
            
            let html = '<h3>File Analysis Results</h3>';
            html += `<p><strong>File Name:</strong> ${file.name}</p>`;
            html += `<p><strong>File Size:</strong> ${(file.size / 1024).toFixed(2)} KB (${(file.size / 1024 / 1024).toFixed(2)} MB)</p>`;
            html += `<p><strong>File Type:</strong> ${file.type}</p>`;
            html += `<p><strong>Extension:</strong> ${file.name.split('.').pop()}</p>`;
            html += `<p><strong>Format Valid:</strong> ${isValidFormat ? '✅ Yes' : '❌ No'}</p>`;
            html += `<p><strong>Size Valid:</strong> ${isValidSize ? '✅ Yes' : '❌ No'}</p>`;
            
            if (!isValidFormat || !isValidSize) {
                resultsDiv.className = 'results error';
                html += '<h4>❌ File Validation Failed</h4>';
                if (!isValidFormat) {
                    html += '<p>File must have .xlsx or .xls extension</p>';
                }
                if (!isValidSize) {
                    html += '<p>File must be less than 10MB</p>';
                }
                resultsDiv.innerHTML = html;
                return;
            }
            
            // Try to parse the file
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    html += '<h4>✅ File Parsing Successful</h4>';
                    html += `<p><strong>Sheets:</strong> ${workbook.SheetNames.join(', ')}</p>`;
                    
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    html += `<p><strong>Total Rows:</strong> ${jsonData.length}</p>`;
                    html += `<p><strong>Total Columns:</strong> ${jsonData[0] ? jsonData[0].length : 0}</p>`;
                    
                    if (jsonData.length > 0) {
                        html += '<h4>Headers (First Row):</h4>';
                        html += '<pre>' + JSON.stringify(jsonData[0], null, 2) + '</pre>';
                        
                        if (jsonData.length > 1) {
                            html += '<h4>First Data Row:</h4>';
                            html += '<pre>' + JSON.stringify(jsonData[1], null, 2) + '</pre>';
                        }
                        
                        if (jsonData.length > 2) {
                            html += '<h4>Second Data Row:</h4>';
                            html += '<pre>' + JSON.stringify(jsonData[2], null, 2) + '</pre>';
                        }
                    }
                    
                    resultsDiv.className = 'results success';
                    resultsDiv.innerHTML = html;
                    
                } catch (error) {
                    resultsDiv.className = 'results error';
                    html += '<h4>❌ File Parsing Failed</h4>';
                    html += `<p><strong>Error:</strong> ${error.message}</p>`;
                    html += '<p>This might indicate the file is corrupted or not a valid Excel file.</p>';
                    resultsDiv.innerHTML = html;
                }
            };
            
            reader.onerror = function() {
                resultsDiv.className = 'results error';
                resultsDiv.innerHTML = '<h4>❌ File Reading Failed</h4><p>Could not read the file.</p>';
            };
            
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
